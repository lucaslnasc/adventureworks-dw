name: Tests
on: [push, pull_request]
jobs:
  postgres-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dw_test
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: test_aw_dw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dw_test -d test_aw_dw"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: dw_test
      PGPASSWORD: ci_test_only
      PGDATABASE: test_aw_dw
      DW_TEST_DATABASE: test_aw_dw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
